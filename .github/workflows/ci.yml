name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, intl, bcmath, zip
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: composer audit
      - name: Tests (SQLite in memory, see phpunit.xml)
        run: |
          set +e
          php artisan test --log-junit=junit.xml
          status=$?
          set -e
          # Show every failing test as an annotation, so the reason is visible without opening the log.
          if [ $status -ne 0 ] && [ -f junit.xml ]; then
            php -r '
              $xml = @simplexml_load_file("junit.xml");
              if (!$xml) { exit; }
              foreach ($xml->xpath("//testcase[failure or error]") as $case) {
                $problem = isset($case->failure) ? $case->failure : $case->error;
                $text = preg_replace("/\s+/", " ", trim((string) $problem));
                echo "::error::" . $case["class"] . "::" . $case["name"] . " | " . substr($text, 0, 800) . "\n";
              }
            '
          fi
          exit $status

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng build
      - run: npx ng test --watch=false
