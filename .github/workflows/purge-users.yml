name: Remove all users (keep super admin)

# Manual only: GitHub > Actions > "Remove all users (keep super admin)" > Run workflow.
# Deletes every account except super admins, with the companies, teams,
# invitations, shortlists and creator profiles they own. Sample influencers
# and audit logs stay. A JSON backup is written on the server first
# (brandmate-app/storage/app/private/backups). Only row counts are logged here.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run shows what would be deleted; delete removes it'
        type: choice
        options: [dry-run, delete]
        default: dry-run
      confirm:
        description: 'For delete, type exactly: DELETE ALL USERS'
        required: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
      SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
      SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
      DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
    steps:
      - name: Check confirmation
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$MODE" = "delete" ] && [ "$CONFIRM" != "DELETE ALL USERS" ]; then
            echo "::error::To delete, type DELETE ALL USERS in the confirm box."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Connect to Hostinger and find the install
        uses: ./.github/actions/hostinger-ssh
        with:
          ssh-key: ${{ secrets.HOSTINGER_SSH_KEY }}

      - name: Run users:purge on the server
        env:
          MODE: ${{ inputs.mode }}
        run: |
          flag=--dry-run
          [ "$MODE" = "delete" ] && flag=--force
          set +e
          ssh hostinger "cd '$APP_DIR' && php artisan users:purge $flag --no-ansi" > /tmp/purge.log 2>&1
          status=$?
          set -e
          grep -v 'post-quantum\|store now, decrypt later\|openssh.com/pq' /tmp/purge.log | sed "s#/home/$SSH_USER/#~/#g"
          if [ $status -ne 0 ]; then
            echo "::error::users:purge failed: $(grep -v 'post-quantum\|store now\|openssh.com/pq\|^\s*$' /tmp/purge.log | tail -4 | tr '\n' ' ' | cut -c1-600)"
            exit 1
          fi
          # Counts only (no names or emails) as an annotation readable without logging in.
          summary=$(grep -E '^\| [a-z_ ()]+ +\| +[0-9]+ +\|' /tmp/purge.log | sed -E 's/\| *([^|]*[^ |]) *\| *([0-9]+) *\|/\1=\2/' | tr '\n' ' ')
          echo "::notice::users:purge $MODE: $summary"
