name: Deploy to Hostinger

# Runs after CI passes on main, or by hand from the Actions tab.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
      SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
      SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
      # Folder that holds public_html, e.g. domains/yourdomain.com (relative to the SSH home).
      DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
    steps:
      - name: Check deploy settings
        run: |
          missing=""
          for name in SSH_HOST SSH_PORT SSH_USER DEPLOY_PATH; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          [ -n "${{ secrets.HOSTINGER_SSH_KEY }}" ] || missing="$missing SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (see deploy/hostinger/GITHUB-DEPLOY.md)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the Angular app
        working-directory: frontend
        run: |
          npm ci
          npx ng build --configuration production

      - name: Assemble the web root
        run: |
          mkdir -p out/public_html
          cp -r frontend/dist/frontend/browser/. out/public_html/
          cp deploy/hostinger/public_html/index.php deploy/hostinger/public_html/.htaccess out/public_html/

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          # Keys copied on Windows often carry CRLF line endings, which OpenSSH rejects.
          # Anything pasted before the BEGIN line (a title, blank lines, spaces) is dropped.
          printf '%s\n' "$SSH_KEY" | tr -d '\r' | sed 's/^[[:space:]]*//' \
            | awk '/^-----BEGIN /{found=1} found' > ~/.ssh/id_deploy
          if [ ! -s ~/.ssh/id_deploy ]; then
            body=$(printf '%s\n' "$SSH_KEY" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v '^$')
            if [ -n "$body" ] && ! printf '%s\n' "$body" | grep -vqE '^[A-Za-z0-9+/=]+$'; then
              # Only the key body was pasted: put the OpenSSH header and footer back.
              { echo '-----BEGIN OPENSSH PRIVATE KEY-----'; printf '%s\n' "$body"; echo '-----END OPENSSH PRIVATE KEY-----'; } > ~/.ssh/id_deploy
            else
              printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy  # keep as-is for the checks below
            fi
          fi
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<EOF
          Host hostinger
            HostName $SSH_HOST
            Port $SSH_PORT
            User $SSH_USER
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking accept-new
            ConnectTimeout 20
          EOF

      - name: Test the SSH connection
        run: |
          first=$(head -1 ~/.ssh/id_deploy)
          case "$first" in
            ssh-*|ecdsa-*) echo "::error::HOSTINGER_SSH_KEY holds a PUBLIC key (.pub). Use the private key file without .pub."; exit 1 ;;
            PuTTY-User-Key-File*) echo "::error::HOSTINGER_SSH_KEY is a PuTTY .ppk key. Export it in PuTTYgen via Conversions > Export OpenSSH key."; exit 1 ;;
            -----BEGIN*) ;;
            *)
              lines=$(wc -l < ~/.ssh/id_deploy)
              if echo "$first" | grep -Eq '^[A-Za-z0-9+/=]+$'; then kind="only base64 characters (the BEGIN line is missing)";
              elif echo "$first" | grep -q ' '; then kind="words with spaces (a password or note?)";
              else kind="other characters"; fi
              echo "::error::HOSTINGER_SSH_KEY has no -----BEGIN line. It has $lines lines; the first is ${#first} characters of $kind. If you also have a HOSTINGER_SSH_KEY under Settings > Environments > production, it overrides the repository secret."
              exit 1 ;;
          esac
          if ! ssh-keygen -y -P '' -f ~/.ssh/id_deploy > /dev/null 2> /tmp/keyerr; then
            echo "::error::HOSTINGER_SSH_KEY could not be read ($(cat /tmp/keyerr)). Keys with a passphrase are not supported; create one with -N \"\". The key has $(wc -l < ~/.ssh/id_deploy) lines and ends with: $(tail -1 ~/.ssh/id_deploy | cut -c1-30)"
            exit 1
          fi
          if ! ssh hostinger 'echo connected; pwd' 2> /tmp/ssherr; then
            echo "::error::SSH to $SSH_USER@host:$SSH_PORT failed: $(tail -3 /tmp/ssherr | tr '\n' ' ' | sed "s/$SSH_HOST/host/g")"
            exit 1
          fi

      # Finds the live install instead of assuming a layout:
      #   WEB_DIR = the folder the site is served from (its index.php loads brandmate-app)
      #   APP_DIR = the brandmate-app that index.php loads, checked in the same order as index.php
      - name: Locate the live install
        run: |
          path=$(printf '%s' "$DEPLOY_PATH" | sed -e 's#^~/##' -e 's#/*$##')
          ssh hostinger bash -s -- "$path" > /tmp/locate <<'REMOTE'
          set -e
          cd ~
          path="$1"
          web=""
          for c in "$path" "$path/public_html"; do
            if [ -f "$c/index.php" ] && grep -q brandmate-app "$c/index.php"; then web="$c"; break; fi
          done
          if [ -z "$web" ]; then
            # Look for the BrandMate web root anywhere under domains/ (main domain or subdomain folder).
            web=$(grep -l brandmate-app domains/*/public_html/index.php domains/*/public_html/*/index.php 2>/dev/null \
              | xargs -r -n1 dirname | head -20 | tr '\n' ' ')
            set -- $web
            if [ "$#" -ne 1 ]; then echo "ERR candidates: ${web:-none}"; exit 0; fi
            web="$1"
          fi
          web=$(cd "$web" && pwd)
          app=""
          for c in "$web/../brandmate-app" "$web/../../brandmate-app"; do
            if [ -f "$c/bootstrap/app.php" ]; then app=$(cd "$c" && pwd); break; fi
          done
          if [ -z "$app" ]; then echo "ERR no brandmate-app with bootstrap/app.php next to $web"; exit 0; fi
          echo "WEB_DIR=$web"
          echo "APP_DIR=$app"
          REMOTE
          if grep -q '^ERR' /tmp/locate; then
            echo "::error::Could not find the live BrandMate install. $(sed 's/^ERR //' /tmp/locate | sed "s#/home/$SSH_USER/##g"). Set HOSTINGER_DEPLOY_PATH to the folder that holds the site's index.php, e.g. domains/yourdomain.com/public_html/brandmate"
            exit 1
          fi
          cat /tmp/locate >> "$GITHUB_ENV"
          sed "s#/home/$SSH_USER/#~/#" /tmp/locate

      # Nothing on the server is deleted: .env, storage, vendor and older
      # asset files stay. Old hashed asset files are harmless.
      - name: Upload the Laravel app
        run: |
          printf '%s\n' '.env' '.env.*' '/vendor/' '/node_modules/' '/storage/' '/tests/' \
            '/bootstrap/cache/*.php' '*.sqlite' '*.log' > /tmp/rsync-exclude
          rsync -az --exclude-from=/tmp/rsync-exclude backend/ "hostinger:$APP_DIR/"

      - name: Install dependencies and migrate
        run: |
          set +e
          ssh hostinger bash -s -- "$APP_DIR" > /tmp/install.log 2>&1 <<'REMOTE'
          set -e
          cd "$1"
          echo "php: $(php -r 'echo PHP_VERSION;')"
          COMPOSER=$(command -v composer2 || command -v composer || true)
          echo "composer: ${COMPOSER:-not found}"
          [ -n "$COMPOSER" ] || exit 3
          mkdir -p storage/app storage/framework/cache storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
          echo "== composer install"; $COMPOSER install --no-dev --optimize-autoloader --no-interaction
          echo "== migrate"; php artisan migrate --force
          echo "== cache"; php artisan config:cache; php artisan route:cache; php artisan view:cache
          REMOTE
          status=$?
          set -e
          grep -v 'post-quantum\|store now, decrypt later\|openssh.com/pq' /tmp/install.log | tail -40
          if [ $status -ne 0 ]; then
            summary=$(grep -E '^(php|composer):|^== ' /tmp/install.log | tr '\n' ' ')
            last=$(grep -v 'post-quantum\|store now\|openssh.com/pq\|^\s*$' /tmp/install.log | tail -6 | tr '\n' ' ' | cut -c1-900)
            echo "::error::Install failed (exit $status). $summary... Last output: $last"
            exit 1
          fi

      # The web root goes last, so the new pages only appear once the API is ready.
      - name: Upload the website
        run: rsync -az out/public_html/ "hostinger:$WEB_DIR/"
